[package]
name = "agentree"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A safety-oriented local CLI for isolated Git worktree tasks"
license = "MIT"
repository = "https://github.com/ydah/agentree"
homepage = "https://github.com/ydah/agentree"
documentation = "https://docs.rs/agentree"
readme = "README.md"
keywords = ["cli", "git", "worktree", "task-runner", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "agentree"
path = "src/lib.rs"

[[bin]]
name = "agentree"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
globset = "0.4.20"
libc = "0.2.189"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.18"
toml = "0.8.23"

[dev-dependencies]
tempfile = "3.27.0"
